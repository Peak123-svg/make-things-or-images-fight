<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Npcs Fight!</title>
    <style>
        body {
            background-color: #111111;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #setup-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #222222;
            padding: 30px;
            border-radius: 4px;
            text-align: center;
            width: 520px;
        }

        .team-names-container {
            display: flex;
            gap: 10px;
            justify-content: space-between;
        }

        .fighter-inputs {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .fighter-input-row {
            display: flex;
            gap: 10px;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 4px;
            align-items: center;
            justify-content: space-between;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
            text-align: left;
        }

        .input-group input[type="text"], .input-group select {
            padding: 5px;
            background: #1a1a1a;
            color: white;
            border: 1px solid #555;
            border-radius: 3px;
        }

        button {
            padding: 10px 20px;
            background-color: #444444;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background-color: #555555;
        }

        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        #hud {
            display: flex;
            justify-content: space-between;
            width: 900px;
            font-size: 14px;
            font-weight: bold;
            overflow-x: auto;
            white-space: nowrap;
            max-width: 900px;
        }

        #camera-controls {
            display: flex;
            gap: 5px;
        }

        #camera-controls button {
            padding: 4px 8px;
            font-size: 12px;
            background: #333333;
        }

        #viewport {
            width: 900px;
            height: 520px;
            border: 2px solid #555555;
            position: relative;
            background: #1a1a1a;
            overflow: hidden;
            border-radius: 4px;
        }

        #world {
            position: absolute;
            width: 3000px;
            height: 1800px;
            background: #1e1e1e;
            transform-origin: 0 0;
        }

        .platform {
            position: absolute;
            background: #333333;
            border-radius: 4px;
        }

        .fighter-wrapper {
            position: absolute;
            width: 140px;
            height: 140px;
            transition: opacity 0.5s ease-out;
            opacity: 1;
        }

        .fighter {
            position: absolute;
            width: 140px;
            height: 140px;
            object-fit: contain;
            background: #2a2a2a;
            border: 2px solid #ffffff;
            box-sizing: border-box;
            border-radius: 4px;
        }

        .username-tag {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            padding: 2px 6px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 3px;
            white-space: nowrap;
            border: 1px solid #555;
            z-index: 10;
        }

        .projectile {
            position: absolute;
            width: 24px;
            height: 24px;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
        }

        .lightning {
            position: absolute;
            height: 6px;
            background: #ffcc00;
            pointer-events: none;
            z-index: 15;
        }

        .floating-text {
            position: absolute;
            font-weight: bold;
            font-size: 20px;
            color: #ff4444;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
            z-index: 20;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-40px); opacity: 0; }
        }

        #winner-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: bold;
            color: #ffffff;
            display: none;
            z-index: 30;
            text-align: center;
            background: #222222;
            padding: 30px;
            border: 2px solid #555555;
            border-radius: 4px;
        }

        #winner-banner img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border: 2px solid #ffffff;
            border-radius: 4px;
            margin-top: 15px;
            background: #111;
        }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h2>Npc Maker Arena (Teams)</h2>
        
        <div class="team-names-container">
            <div class="input-group" style="flex: 1;">
                <label>Team 1 Name:</label>
                <input type="text" id="team1-name" value="Team 1">
            </div>
            <div class="input-group" style="flex: 1;">
                <label>Team 2 Name:</label>
                <input type="text" id="team2-name" value="Team 2">
            </div>
        </div>

        <div class="input-group">
            <label>Number of Fighters:</label>
            <input type="number" id="fighter-count" min="2" value="4" onchange="updateFighterInputs()" style="padding: 6px; background: #333; color: white; border: 1px solid #555;">
        </div>

        <div class="fighter-inputs" id="fighter-inputs-container">
            <!-- Dynamically populated -->
        </div>
        <button onclick="startBattle()">Start Fight</button>
    </div>

    <div id="game-screen">
        <div id="hud">
            <div id="hud-stats"></div>
            <div id="camera-controls">
                <button onclick="setCameraMode('dynamic')">Cam: Dynamic</button>
                <button onclick="setCameraMode('zoomout')">Zoom Out</button>
            </div>
        </div>
        <div id="viewport">
            <div id="world">
                <div id="platforms-container"></div>
                <div id="winner-banner">
                    <div id="winner-text"></div>
                    <img id="winner-img" src="" alt="Winner">
                </div>
                <div id="fighters-container"></div>
            </div>
        </div>
    </div>

    <audio id="bgm" loop>
        <source src="https://raw.githubusercontent.com/Peak123-svg/make-things-or-images-fight/main/Roblox%20Music%20-%20Gothic%20-%20Zero%20Project%204.mp3" type="audio/mpeg">
    </audio>

    <script>
        const worldWidth = 3000;
        const worldHeight = 1800;
        const size = 140;

        let fighters = [];
        let projectiles = [];
        let gameRunning = false;
        let cameraMode = 'dynamic';
        let currentPlatforms = [];
        let teamNames = { team1: "Team Alpha", team2: "Team Bravo" };

        const weaponsPool = [
            { name: "Sword", type: "melee", damageMultiplier: 1.2, range: 40 },
            { name: "Gun", type: "projectile", damageMultiplier: 1.0, speed: 28 },
            { name: "Laser Rifle", type: "projectile", damageMultiplier: 1.4, speed: 35 },
            { name: "Magic Wand", type: "lightning", damageMultiplier: 1.5, range: 300 },
            { name: "War Hammer", type: "melee", damageMultiplier: 1.7, range: 50 },
            { name: "Crossbow", type: "projectile", damageMultiplier: 1.1, speed: 24 },
            { name: "Dagger", type: "melee", damageMultiplier: 0.9, range: 30 }
        ];

        const mapPool = [
            // Stage 1: Classic Flat Floor
            [ { x: 750, y: 950, w: 1500, h: 60 } ],
            // Stage 2: Twin Towers
            [
                { x: 600, y: 1000, w: 600, h: 50 },
                { x: 1800, y: 1000, w: 600, h: 50 },
                { x: 1100, y: 800, w: 800, h: 50 }
            ],
            // Stage 3: Three Stepping Stones
            [
                { x: 500, y: 1100, w: 400, h: 50 },
                { x: 1300, y: 950, w: 400, h: 50 },
                { x: 2100, y: 1100, w: 400, h: 50 }
            ],
            // Stage 4: Central Fortress
            [
                { x: 1000, y: 900, w: 1000, h: 80 },
                { x: 700, y: 700, w: 300, h: 40 },
                { x: 2000, y: 700, w: 300, h: 40 }
            ],
            // Stage 5: Multi-Tier Staircase
            [
                { x: 400, y: 1100, w: 500, h: 40 },
                { x: 1100, y: 950, w: 800, h: 40 },
                { x: 2100, y: 1100, w: 500, h: 40 },
                { x: 1250, y: 700, w: 500, h: 40 }
            ],
            // Stage 6: The Pit of Despair
            [
                { x: 500, y: 1000, w: 500, h: 40 },
                { x: 2000, y: 1000, w: 500, h: 40 },
                { x: 1150, y: 1200, w: 700, h: 40 },
                { x: 1250, y: 800, w: 500, h: 40 }
            ],
            // Stage 7: Vertical Tower Climb
            [
                { x: 1000, y: 1200, w: 1000, h: 40 },
                { x: 1200, y: 1000, w: 600, h: 40 },
                { x: 1300, y: 800, w: 400, h: 40 },
                { x: 1400, y: 600, w: 200, h: 40 }
            ],
            // Stage 8: Floating Islands
            [
                { x: 400, y: 900, w: 350, h: 40 },
                { x: 900, y: 1050, w: 350, h: 40 },
                { x: 1400, y: 900, w: 350, h: 40 },
                { x: 1900, y: 1050, w: 350, h: 40 },
                { x: 2350, y: 900, w: 350, h: 40 }
            ],
            // Stage 9: Dual Bridges
            [
                { x: 500, y: 850, w: 800, h: 40 },
                { x: 1700, y: 850, w: 800, h: 40 },
                { x: 900, y: 1150, w: 1200, h: 40 }
            ],
            // Stage 10: Pyramid Step
            [
                { x: 750, y: 1100, w: 1500, h: 50 },
                { x: 950, y: 950, w: 1100, h: 50 },
                { x: 1150, y: 800, w: 700, h: 50 },
                { x: 1350, y: 650, w: 300, h: 50 }
            ]
        ];

        const massiveAttackPool = [
            { name: "Heavy Strike", damage: 90, type: "melee", kb: 35 },
            { name: "Blast", damage: 110, type: "projectile", kb: 28 },
            { name: "Zap", damage: 140, type: "lightning", kb: 32 },
            { name: "Smash", damage: 160, type: "melee", kb: 50 },
            { name: "Slash", damage: 95, type: "projectile", kb: 25 },
            { name: "Beam", damage: 150, type: "projectile", kb: 40 },
            { name: "Quake", damage: 180, type: "lightning", kb: 45 },
            { name: "Kick", damage: 100, type: "melee", kb: 38 },
            { name: "Sonic Wave", damage: 120, type: "projectile", kb: 30 },
            { name: "God Smash", damage: 200, type: "lightning", kb: 55 },
            { name: "Plasma Ray", damage: 130, type: "projectile", kb: 33 },
            { name: "Grounder", damage: 170, type: "melee", kb: 48 }
        ];

        function updateFighterInputs() {
            let count = parseInt(document.getElementById('fighter-count').value);
            if (isNaN(count) || count < 2) count = 2;
            let container = document.getElementById('fighter-inputs-container');
            container.innerHTML = '';
            
            let t1Name = document.getElementById('team1-name') ? document.getElementById('team1-name').value : "Team Alpha";
            let t2Name = document.getElementById('team2-name') ? document.getElementById('team2-name').value : "Team Bravo";

            for (let i = 0; i < count; i++) {
                let defaultTeam = i % 2 === 0 ? 'team1' : 'team2';
                container.innerHTML += `
                    <div class="fighter-input-row">
                        <div class="input-group">
                            <label>Name ${i + 1}</label>
                            <input type="text" id="name${i}" value="Fighter ${i + 1}">
                        </div>
                        <div class="input-group">
                            <label>Team</label>
                            <select id="team${i}">
                                <option value="team1" ${defaultTeam === 'team1' ? 'selected' : ''}>${t1Name}</option>
                                <option value="team2" ${defaultTeam === 'team2' ? 'selected' : ''}>${t2Name}</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Image</label>
                            <input type="file" id="img${i}-input" accept="image/*" style="width: 130px;">
                        </div>
                    </div>
                `;
            }
        }

        updateFighterInputs();

        function setCameraMode(mode) {
            cameraMode = mode;
        }

        function loadRandomMap() {
            const container = document.getElementById('platforms-container');
            container.innerHTML = '';
            
            let randomMap = mapPool[Math.floor(Math.random() * mapPool.length)];
            currentPlatforms = randomMap;

            randomMap.forEach(p => {
                let pDiv = document.createElement('div');
                pDiv.className = 'platform';
                pDiv.style.left = p.x + 'px';
                pDiv.style.top = p.y + 'px';
                pDiv.style.width = p.w + 'px';
                pDiv.style.height = p.h + 'px';
                container.appendChild(pDiv);
            });
        }

        function startBattle() {
            let count = parseInt(document.getElementById('fighter-count').value);
            if (isNaN(count) || count < 2) count = 2;
            
            teamNames.team1 = document.getElementById('team1-name').value.trim() || "Team Alpha";
            teamNames.team2 = document.getElementById('team2-name').value.trim() || "Team Bravo";
            
            fighters = [];
            let fightersContainer = document.getElementById('fighters-container');
            fightersContainer.innerHTML = '';

            for (let i = 0; i < count; i++) {
                let fileInput = document.getElementById(`img${i}-input`);
                let nameInput = document.getElementById(`name${i}`);
                let teamSelect = document.getElementById(`team${i}`);

                if (!fileInput || !fileInput.files[0]) {
                    alert(`Please upload images for all ${count} fighters!`);
                    return;
                }

                let fighterName = nameInput && nameInput.value.trim() !== "" ? nameInput.value.trim() : `Fighter ${i + 1}`;
                let assignedTeam = teamSelect ? teamSelect.value : 'team1';
                let assignedWeapon = weaponsPool[Math.floor(Math.random() * weaponsPool.length)];

                let wrapper = document.createElement('div');
                wrapper.className = 'fighter-wrapper';

                let imgEl = document.createElement('img');
                imgEl.className = 'fighter';
                imgEl.src = URL.createObjectURL(fileInput.files[0]);

                let userTag = document.createElement('div');
                userTag.className = 'username-tag';
                userTag.innerText = `[${assignedTeam === 'team1' ? teamNames.team1 : teamNames.team2}] ${fighterName}`;

                wrapper.appendChild(userTag);
                wrapper.appendChild(imgEl);
                fightersContainer.appendChild(wrapper);

                let spawnX = 500 + (i * (1800 / count));

                fighters.push({
                    id: i + 1,
                    name: fighterName,
                    team: assignedTeam,
                    x: spawnX,
                    y: 700,
                    vx: 0,
                    vy: 0,
                    hp: 1000,
                    cooldown: 0,
                    weapon: assignedWeapon,
                    wrapperEl: wrapper
                });
            }

            loadRandomMap();

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';

            const music = document.getElementById('bgm');
            music.play().catch(e => console.log("Audio autoplay blocked:", e));

            updateHUD();
            gameRunning = true;
            requestAnimationFrame(updateGame);
        }

        function updateBotAI(fighter, targets) {
            if (fighter.hp <= 0) return;
            if (fighter.cooldown > 0) fighter.cooldown--;

            let enemyTargets = targets.filter(t => t.hp > 0 && t.team !== fighter.team);
            if (enemyTargets.length === 0) return;

            let closest = enemyTargets[0];
            let minDist = Infinity;
            for (let t of enemyTargets) {
                let d = Math.hypot(t.x - fighter.x, t.y - fighter.y);
                if (d < minDist) {
                    minDist = d;
                    closest = t;
                }
            }

            let dx = closest.x - fighter.x;
            if (Math.abs(dx) > 35) {
                fighter.vx += Math.sign(dx) * 0.7;
            }
            fighter.vx *= 0.85;

            fighter.vx = Math.max(-10, Math.min(10, fighter.vx));
            fighter.x += fighter.vx;

            let prevY = fighter.y;
            fighter.vy += 0.8;
            fighter.y += fighter.vy;

            let landedOnPlatform = false;
            for (let p of currentPlatforms) {
                let prevBottom = prevY + size;
                let currBottom = fighter.y + size;

                if (
                    fighter.x + size > p.x &&
                    fighter.x < p.x + p.w &&
                    prevBottom <= p.y + 10 &&
                    currBottom >= p.y &&
                    fighter.vy >= 0
                ) {
                    fighter.y = p.y - size;
                    fighter.vy = 0;
                    landedOnPlatform = true;
                    break;
                }
            }

            if (landedOnPlatform && Math.random() < 0.005) {
                fighter.vy = -14;
            }

            if (fighter.y > 1650) {
                fighter.hp -= 30;
                if (fighter.hp <= 0) {
                    fighter.hp = 0;
                    fighter.wrapperEl.style.opacity = '0';
                }
                showWorldText(fighter.x, fighter.y, `${fighter.name} Fell! (-30)`);
                updateHUD();
                checkWin();

                if (fighter.hp > 0) {
                    fighter.y = 600;
                    fighter.vy = -10;
                    fighter.x = 1000 + (Math.random() * 800 - 400);
                }
            }

            if (fighter.x < 50) { fighter.x = 50; fighter.vx *= -1; }
            if (fighter.x > worldWidth - size - 50) { fighter.x = worldWidth - size - 50; fighter.vx *= -1; }
        }

        function updateGame() {
            if (!gameRunning) return;

            for (let i = 0; i < fighters.length; i++) {
                if (fighters[i].hp <= 0) continue;
                let otherTargets = fighters.filter((_, idx) => idx !== i && fighters[idx].hp > 0);
                if (otherTargets.length > 0) {
                    updateBotAI(fighters[i], otherTargets);
                }
            }

            for (let i = 0; i < fighters.length; i++) {
                for (let j = i + 1; j < fighters.length; j++) {
                    let fA = fighters[i];
                    let fB = fighters[j];
                    if (fA.hp <= 0 || fB.hp <= 0) continue;

                    let stackDx = fB.x - fA.x;
                    let stackDy = fB.y - fA.y;
                    let stackDist = Math.hypot(stackDx, stackDy);
                    if (stackDist < size * 0.75) {
                        let pushDir = stackDx >= 0 ? 1 : -1;
                        fA.x -= pushDir * 2;
                        fB.x += pushDir * 2;
                    }

                    let distance = Math.hypot((fA.x + size/2) - (fB.x + size/2), (fA.y + size/2) - (fB.y + size/2));
                    if (distance < size && fA.team !== fB.team) {
                        let angle = Math.atan2((fA.y + size/2) - (fB.y + size/2), (fA.x + size/2) - (fB.x + size/2));
                        fA.vx = Math.cos(angle) * 25;
                        fA.vy = -14;
                        fB.vx = -Math.cos(angle) * 25;
                        fB.vy = -14;

                        if (fA.cooldown === 0 && fB.cooldown === 0) {
                            let attacker = Math.random() > 0.5 ? fA : fB;
                            let target = attacker === fA ? fB : fA;
                            executeAttack(attacker, target);
                            fA.cooldown = 65;
                            fB.cooldown = 65;
                        }
                    }
                }
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.el.style.left = p.x + 'px';
                p.el.style.top = p.y + 'px';

                let hitTarget = null;
                let ownerFighter = fighters.find(f => f.id === p.ownerId);

                for (let f of fighters) {
                    if (ownerFighter && f.team !== ownerFighter.team && f.hp > 0) {
                        let tDist = Math.hypot(p.x - (f.x + size/2), p.y - (f.y + size/2));
                        if (tDist < size/2) {
                            hitTarget = f;
                            break;
                        }
                    }
                }

                if (hitTarget) {
                    hitTarget.hp -= p.damage;
                    hitTarget.vy -= p.kb * 0.6;
                    hitTarget.vx += (p.vx > 0 ? 25 : -25);
                    if (hitTarget.hp <= 0) {
                        hitTarget.hp = 0;
                        hitTarget.wrapperEl.style.opacity = '0';
                    }
                    showWorldText(hitTarget.x, hitTarget.y, `${hitTarget.name} hit (-${Math.round(p.damage)})`);
                    updateHUD();
                    p.el.remove();
                    projectiles.splice(i, 1);
                    checkWin();
                } else if (p.x < 0 || p.x > worldWidth || p.y < 0 || p.y > worldHeight) {
                    p.el.remove();
                    projectiles.splice(i, 1);
                }
            }

            for (let f of fighters) {
                f.wrapperEl.style.left = f.x + 'px';
                f.wrapperEl.style.top = f.y + 'px';
            }

            updateCamera();
            requestAnimationFrame(updateGame);
        }

        function executeAttack(attacker, target) {
            if (!gameRunning || target.hp <= 0 || attacker.team === target.team) return;
            let baseAttack = massiveAttackPool[Math.floor(Math.random() * massiveAttackPool.length)];
            let finalDamage = Math.round(baseAttack.damage * attacker.weapon.damageMultiplier);

            if (attacker.weapon.type === "projectile" || baseAttack.type === "projectile") {
                let speed = attacker.weapon.speed || 22;
                let angle = Math.atan2((target.y + size/2) - (attacker.y + size/2), (target.x + size/2) - (attacker.x + size/2));
                let pEl = document.createElement('div');
                pEl.className = 'projectile';
                document.getElementById('world').appendChild(pEl);

                projectiles.push({
                    x: attacker.x + size/2,
                    y: attacker.y + size/2,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    damage: finalDamage,
                    kb: baseAttack.kb,
                    ownerId: attacker.id,
                    el: pEl
                });
                showWorldText(attacker.x, attacker.y, `${attacker.name}: ${baseAttack.name}`);
            } else if (attacker.weapon.type === "lightning" || baseAttack.type === "lightning") {
                target.hp -= finalDamage;
                target.vy -= baseAttack.kb * 0.7;
                target.vx += (attacker.x < target.x ? 25 : -25);
                if (target.hp <= 0) {
                    target.hp = 0;
                    target.wrapperEl.style.opacity = '0';
                }

                let lEl = document.createElement('div');
                lEl.className = 'lightning';
                let startX = attacker.x + size/2;
                let startY = attacker.y + size/2;
                let endX = target.x + size/2;
                let endY = target.y + size/2;
                let dist = Math.hypot(endX - startX, endY - startY);
                let angle = Math.atan2(endY - startY, endX - startX) * 180 / Math.PI;

                lEl.style.width = dist + 'px';
                lEl.style.left = startX + 'px';
                lEl.style.top = startY + 'px';
                lEl.style.transformOrigin = '0 0';
                lEl.style.transform = `rotate(${angle}deg)`;

                document.getElementById('world').appendChild(lEl);
                setTimeout(() => lEl.remove(), 250);

                showWorldText(target.x, target.y, `${target.name} zapped! (-${finalDamage})`);
                updateHUD();
                checkWin();
            } else {
                target.hp -= finalDamage;
                target.vy -= baseAttack.kb * 0.7;
                target.vx += (attacker.x < target.x ? 30 : -30);
                if (target.hp <= 0) {
                    target.hp = 0;
                    target.wrapperEl.style.opacity = '0';
                }
                showWorldText(target.x, target.y, `${attacker.name} Hit! (-${finalDamage})`);
                updateHUD();
                checkWin();
            }
        }

        function updateCamera() {
            let viewportW = 900;
            let viewportH = 520;
            let camX = 0, camY = 0, scale = 1.0;

            let aliveFighters = fighters.filter(f => f.hp > 0);
            let focusGroup = aliveFighters.length > 0 ? aliveFighters : fighters;

            if (cameraMode === 'dynamic') {
                let sumX = 0, sumY = 0;
                for (let f of focusGroup) {
                    sumX += f.x + size/2;
                    sumY += f.y + size/2;
                }
                let midX = sumX / focusGroup.length;
                let midY = sumY / focusGroup.length;

                let maxSpread = 0;
                for (let i = 0; i < focusGroup.length; i++) {
                    for (let j = i + 1; j < focusGroup.length; j++) {
                        let d = Math.hypot(focusGroup[i].x - focusGroup[j].x, focusGroup[i].y - focusGroup[j].y);
                        if (d > maxSpread) maxSpread = d;
                    }
                }

                scale = Math.max(0.25, Math.min(1.0, 900 / (maxSpread + 350)));
                camX = viewportW / 2 - midX * scale;
                camY = viewportH / 2 - midY * scale;
            } else if (cameraMode === 'zoomout') {
                scale = 0.28;
                camX = (viewportW - worldWidth * scale) / 2;
                camY = (viewportH - worldHeight * scale) / 2;
            }

            document.getElementById('world').style.transform = `translate(${camX}px, ${camY}px) scale(${scale})`;
        }

        function updateHUD() {
            let hudText = fighters.map(f => {
                let tName = f.team === 'team1' ? teamNames.team1 : teamNames.team2;
                return `[${tName}] ${f.name}: ${f.hp <= 0 ? 'DEAD' : f.hp}`;
            }).join(' | ');
            document.getElementById('hud-stats').innerText = hudText;
        }

        function showWorldText(x, y, text) {
            let el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.getElementById('world').appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function checkWin() {
            let aliveFighters = fighters.filter(f => f.hp > 0);
            let aliveTeams = [...new Set(aliveFighters.map(f => f.team))];

            if (aliveTeams.length <= 1 && fighters.length > 1) {
                gameRunning = false;
                let winningTeamKey = aliveTeams.length === 1 ? aliveTeams[0] : null;
                let winningTeamLabel = winningTeamKey === 'team1' ? teamNames.team1 : (winningTeamKey === 'team2' ? teamNames.team2 : "No One");

                document.getElementById('winner-text').innerText = `${winningTeamLabel} Wins!`;
                
                let sampleWinner = aliveFighters.length > 0 ? aliveFighters[0] : fighters[0];
                document.getElementById('winner-img').src = sampleWinner.wrapperEl.querySelector('.fighter').src;
                document.getElementById('winner-banner').style.display = 'block';

                setTimeout(() => location.reload(), 5000);
            }
        }
    </script>
</body>
</html>
