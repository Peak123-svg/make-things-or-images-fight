<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Npcs Fight!</title>
    <style>
        body {
            background-color: #111111;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #setup-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #222222;
            padding: 30px;
            border-radius: 4px;
            text-align: center;
            width: 450px;
        }

        .fighter-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        button {
            padding: 10px 20px;
            background-color: #444444;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background-color: #555555;
        }

        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        #hud {
            display: flex;
            justify-content: space-between;
            width: 900px;
            font-size: 14px;
            font-weight: bold;
            overflow-x: auto;
            white-space: nowrap;
            max-width: 900px;
        }

        #camera-controls {
            display: flex;
            gap: 5px;
        }

        #camera-controls button {
            padding: 4px 8px;
            font-size: 12px;
            background: #333333;
        }

        #viewport {
            width: 900px;
            height: 520px;
            border: 2px solid #555555;
            position: relative;
            background: #1a1a1a;
            overflow: hidden;
            border-radius: 4px;
        }

        #world {
            position: absolute;
            width: 3000px;
            height: 1800px;
            background: #1e1e1e;
            transform-origin: 0 0;
        }

        .platform {
            position: absolute;
            background: #333333;
            border-radius: 4px;
        }

        .fighter {
            position: absolute;
            width: 140px;
            height: 140px;
            object-fit: contain;
            background: #2a2a2a;
            border: 2px solid #ffffff;
            box-sizing: border-box;
            border-radius: 4px;
        }

        .projectile {
            position: absolute;
            width: 24px;
            height: 24px;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
        }

        .lightning {
            position: absolute;
            height: 6px;
            background: #ffcc00;
            pointer-events: none;
            z-index: 15;
        }

        .floating-text {
            position: absolute;
            font-weight: bold;
            font-size: 20px;
            color: #ff4444;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
            z-index: 20;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-40px); opacity: 0; }
        }

        #winner-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            font-weight: bold;
            color: #ffffff;
            display: none;
            z-index: 30;
            text-align: center;
            background: #222222;
            padding: 30px;
            border: 2px solid #555555;
            border-radius: 4px;
        }

        #winner-banner img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border: 2px solid #ffffff;
            border-radius: 4px;
            margin-top: 15px;
            background: #111;
        }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h2>Npc Maker Arena</h2>
        <div class="input-group">
            <label>Number of Fighters:</label>
            <input type="number" id="fighter-count" min="2" value="2" onchange="updateFighterInputs()" style="padding: 6px; background: #333; color: white; border: 1px solid #555;">
        </div>
        <div class="fighter-inputs" id="fighter-inputs-container">
            <div class="input-group">
                <label>Fighter 1</label>
                <input type="file" id="img0-input" accept="image/*">
            </div>
            <div class="input-group">
                <label>Fighter 2</label>
                <input type="file" id="img1-input" accept="image/*">
            </div>
        </div>
        <button onclick="startBattle()">Start Fight</button>
    </div>

    <div id="game-screen">
        <div id="hud">
            <div id="hud-stats"></div>
            <div id="camera-controls">
                <button onclick="setCameraMode('dynamic')">Cam: Dynamic</button>
                <button onclick="setCameraMode('zoomout')">Zoom Out</button>
            </div>
        </div>
        <div id="viewport">
            <div id="world">
                <div id="platforms-container"></div>
                <div id="winner-banner">
                    <div id="winner-text"></div>
                    <img id="winner-img" src="" alt="Winner">
                </div>
                <div id="fighters-container"></div>
            </div>
        </div>
    </div>

    <audio id="bgm" loop>
        <source src="https://raw.githubusercontent.com/Peak123-svg/make-things-or-images-fight/main/Roblox%20Music%20-%20Gothic%20-%20Zero%20Project%204.mp3" type="audio/mpeg">
    </audio>

    <script>
        const worldWidth = 3000;
        const worldHeight = 1800;
        const size = 140;

        let fighters = [];
        let projectiles = [];
        let gameRunning = false;
        let cameraMode = 'dynamic';
        let currentPlatforms = [];

        const mapPool = [
            [ { x: 750, y: 950, w: 1500, h: 60 } ],
            [
                { x: 600, y: 1000, w: 600, h: 50 },
                { x: 1800, y: 1000, w: 600, h: 50 },
                { x: 1100, y: 800, w: 800, h: 50 }
            ],
            [
                { x: 500, y: 1100, w: 400, h: 50 },
                { x: 1300, y: 950, w: 400, h: 50 },
                { x: 2100, y: 1100, w: 400, h: 50 }
            ],
            [
                { x: 1000, y: 900, w: 1000, h: 80 },
                { x: 700, y: 700, w: 300, h: 40 },
                { x: 2000, y: 700, w: 300, h: 40 }
            ],
            [
                { x: 400, y: 1100, w: 500, h: 40 },
                { x: 1100, y: 950, w: 800, h: 40 },
                { x: 2100, y: 1100, w: 500, h: 40 },
                { x: 1250, y: 700, w: 500, h: 40 }
            ]
        ];

        const massiveAttackPool = [
            { name: "Heavy Punch", damage: 90, type: "melee", kb: 35 },
            { name: "Fireball", damage: 110, type: "projectile", kb: 28 },
            { name: "Thunder Strike", damage: 140, type: "lightning", kb: 32 },
            { name: "Meteor Slam", damage: 160, type: "melee", kb: 50 },
            { name: "Energy Blade", damage: 95, type: "projectile", kb: 25 },
            { name: "Hyper Beam", damage: 150, type: "projectile", kb: 40 },
            { name: "Mega Quake", damage: 180, type: "lightning", kb: 45 },
            { name: "Shadow Kick", damage: 100, type: "melee", kb: 38 },
            { name: "Sonic Blast", damage: 120, type: "projectile", kb: 30 },
            { name: "God Smash", damage: 200, type: "lightning", kb: 55 },
            { name: "Plasma Ray", damage: 130, type: "projectile", kb: 33 },
            { name: "Earth Shatter", damage: 170, type: "melee", kb: 48 },
            { name: "Ice Spike", damage: 105, type: "projectile", kb: 29 },
            { name: "Vortex Kick", damage: 125, type: "melee", kb: 42 },
            { name: "Solar Flare", damage: 190, type: "lightning", kb: 50 }
        ];

        function updateFighterInputs() {
            let count = parseInt(document.getElementById('fighter-count').value);
            if (isNaN(count) || count < 2) count = 2;
            let container = document.getElementById('fighter-inputs-container');
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                container.innerHTML += `
                    <div class="input-group">
                        <label>Fighter ${i + 1}</label>
                        <input type="file" id="img${i}-input" accept="image/*">
                    </div>
                `;
            }
        }

        function setCameraMode(mode) {
            cameraMode = mode;
        }

        function loadRandomMap() {
            const container = document.getElementById('platforms-container');
            container.innerHTML = '';
            
            let randomMap = mapPool[Math.floor(Math.random() * mapPool.length)];
            currentPlatforms = randomMap;

            randomMap.forEach(p => {
                let pDiv = document.createElement('div');
                pDiv.className = 'platform';
                pDiv.style.left = p.x + 'px';
                pDiv.style.top = p.y + 'px';
                pDiv.style.width = p.w + 'px';
                pDiv.style.height = p.h + 'px';
                container.appendChild(pDiv);
            });
        }

        function startBattle() {
            let count = parseInt(document.getElementById('fighter-count').value);
            if (isNaN(count) || count < 2) count = 2;
            fighters = [];

            let fightersContainer = document.getElementById('fighters-container');
            fightersContainer.innerHTML = '';

            for (let i = 0; i < count; i++) {
                let fileInput = document.getElementById(`img${i}-input`);
                if (!fileInput || !fileInput.files[0]) {
                    alert(`Please upload images for all ${count} fighters!`);
                    return;
                }

                let imgEl = document.createElement('img');
                imgEl.className = 'fighter';
                imgEl.src = URL.createObjectURL(fileInput.files[0]);
                fightersContainer.appendChild(imgEl);

                // Spread them out across the stage width
                let spawnX = 500 + (i * (1800 / count));

                fighters.push({
                    id: i + 1,
                    x: spawnX,
                    y: 700,
                    vx: 0,
                    vy: 0,
                    hp: 1000,
                    cooldown: 0,
                    el: imgEl
                });
            }

            loadRandomMap();

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';

            const music = document.getElementById('bgm');
            music.play().catch(e => console.log("Audio autoplay blocked:", e));

            updateHUD();
            gameRunning = true;
            requestAnimationFrame(updateGame);
        }

        function updateBotAI(fighter, targets) {
            if (fighter.cooldown > 0) fighter.cooldown--;

            let closest = targets[0];
            let minDist = Infinity;
            for (let t of targets) {
                let d = Math.hypot(t.x - fighter.x, t.y - fighter.y);
                if (d < minDist) {
                    minDist = d;
                    closest = t;
                }
            }

            let dx = closest.x - fighter.x;
            if (Math.abs(dx) > 35) {
                fighter.vx += Math.sign(dx) * 0.7;
            }
            fighter.vx *= 0.85;

            fighter.vx = Math.max(-10, Math.min(10, fighter.vx));
            fighter.x += fighter.vx;

            let prevY = fighter.y;
            fighter.vy += 0.8;
            fighter.y += fighter.vy;

            let landedOnPlatform = false;
            for (let p of currentPlatforms) {
                let prevBottom = prevY + size;
                let currBottom = fighter.y + size;

                if (
                    fighter.x + size > p.x &&
                    fighter.x < p.x + p.w &&
                    prevBottom <= p.y + 10 &&
                    currBottom >= p.y &&
                    fighter.vy >= 0
                ) {
                    fighter.y = p.y - size;
                    fighter.vy = 0;
                    landedOnPlatform = true;
                    break;
                }
            }

            if (landedOnPlatform && Math.random() < 0.005) {
                fighter.vy = -14;
            }

            if (fighter.y > 1650) {
                fighter.hp -= 30;
                if (fighter.hp < 0) fighter.hp = 0;
                showWorldText(fighter.x, fighter.y, "Fall! (-30)");
                updateHUD();
                checkWin();

                fighter.y = 600;
                fighter.vy = -10;
                fighter.x = 1000 + (Math.random() * 800 - 400);
            }

            if (fighter.x < 50) { fighter.x = 50; fighter.vx *= -1; }
            if (fighter.x > worldWidth - size - 50) { fighter.x = worldWidth - size - 50; fighter.vx *= -1; }
        }

        function updateGame() {
            if (!gameRunning) return;

            for (let i = 0; i < fighters.length; i++) {
                let otherTargets = fighters.filter((_, idx) => idx !== i);
                updateBotAI(fighters[i], otherTargets);
            }

            for (let i = 0; i < fighters.length; i++) {
                for (let j = i + 1; j < fighters.length; j++) {
                    let fA = fighters[i];
                    let fB = fighters[j];
                    let stackDx = fB.x - fA.x;
                    let stackDy = fB.y - fA.y;
                    let stackDist = Math.hypot(stackDx, stackDy);
                    if (stackDist < size * 0.75) {
                        let pushDir = stackDx >= 0 ? 1 : -1;
                        fA.x -= pushDir * 2;
                        fB.x += pushDir * 2;
                    }

                    let distance = Math.hypot((fA.x + size/2) - (fB.x + size/2), (fA.y + size/2) - (fB.y + size/2));
                    if (distance < size) {
                        let angle = Math.atan2((fA.y + size/2) - (fB.y + size/2), (fA.x + size/2) - (fB.x + size/2));
                        fA.vx = Math.cos(angle) * 25;
                        fA.vy = -14;
                        fB.vx = -Math.cos(angle) * 25;
                        fB.vy = -14;

                        if (fA.cooldown === 0 && fB.cooldown === 0) {
                            let attacker = Math.random() > 0.5 ? fA : fB;
                            let target = attacker === fA ? fB : fA;
                            triggerRandomAttack(attacker, target);
                            fA.cooldown = 70;
                            fB.cooldown = 70;
                        }
                    }
                }
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.el.style.left = p.x + 'px';
                p.el.style.top = p.y + 'px';

                let hitTarget = null;
                for (let f of fighters) {
                    if (f.id !== p.ownerId) {
                        let tDist = Math.hypot(p.x - (f.x + size/2), p.y - (f.y + size/2));
                        if (tDist < size/2) {
                            hitTarget = f;
                            break;
                        }
                    }
                }

                if (hitTarget) {
                    hitTarget.hp -= p.damage;
                    hitTarget.vy -= p.kb * 0.6;
                    hitTarget.vx += (p.vx > 0 ? 25 : -25);
                    if (hitTarget.hp < 0) hitTarget.hp = 0;
                    showWorldText(hitTarget.x, hitTarget.y, `Hit! (-${p.damage})`);
                    updateHUD();
                    p.el.remove();
                    projectiles.splice(i, 1);
                    checkWin();
                } else if (p.x < 0 || p.x > worldWidth || p.y < 0 || p.y > worldHeight) {
                    p.el.remove();
                    projectiles.splice(i, 1);
                }
            }

            for (let f of fighters) {
                f.el.style.left = f.x + 'px';
                f.el.style.top = f.y + 'px';
            }

            updateCamera();
            requestAnimationFrame(updateGame);
        }

        function triggerRandomAttack(attacker, target) {
            if (!gameRunning) return;
            let atk = massiveAttackPool[Math.floor(Math.random() * massiveAttackPool.length)];

            if (atk.type === "projectile") {
                let angle = Math.atan2((target.y + size/2) - (attacker.y + size/2), (target.x + size/2) - (attacker.x + size/2));
                let pEl = document.createElement('div');
                pEl.className = 'projectile';
                document.getElementById('world').appendChild(pEl);

                projectiles.push({
                    x: attacker.x + size/2,
                    y: attacker.y + size/2,
                    vx: Math.cos(angle) * 22,
                    vy: Math.sin(angle) * 22,
                    damage: atk.damage,
                    kb: atk.kb,
                    ownerId: attacker.id,
                    el: pEl
                });
                showWorldText(attacker.x, attacker.y, atk.name);
            } else if (atk.type === "lightning") {
                target.hp -= atk.damage;
                target.vy -= atk.kb * 0.7;
                target.vx += (attacker.x < target.x ? 25 : -25);
                if (target.hp < 0) target.hp = 0;

                let lEl = document.createElement('div');
                lEl.className = 'lightning';
                let startX = attacker.x + size/2;
                let startY = attacker.y + size/2;
                let endX = target.x + size/2;
                let endY = target.y + size/2;
                let dist = Math.hypot(endX - startX, endY - startY);
                let angle = Math.atan2(endY - startY, endX - startX) * 180 / Math.PI;

                lEl.style.width = dist + 'px';
                lEl.style.left = startX + 'px';
                lEl.style.top = startY + 'px';
                lEl.style.transformOrigin = '0 0';
                lEl.style.transform = `rotate(${angle}deg)`;

                document.getElementById('world').appendChild(lEl);
                setTimeout(() => lEl.remove(), 250);

                showWorldText(target.x, target.y, `${atk.name} (-${atk.damage})`);
                updateHUD();
                checkWin();
            } else {
                target.hp -= atk.damage;
                target.vy -= atk.kb * 0.7;
                target.vx += (attacker.x < target.x ? 30 : -30);
                if (target.hp < 0) target.hp = 0;
                showWorldText(target.x, target.y, `${atk.name} (-${atk.damage})`);
                updateHUD();
                checkWin();
            }
        }

        function updateCamera() {
            let viewportW = 900;
            let viewportH = 520;
            let camX = 0, camY = 0, scale = 1.0;

            if (cameraMode === 'dynamic') {
                let sumX = 0, sumY = 0;
                for (let f of fighters) {
                    sumX += f.x + size/2;
                    sumY += f.y + size/2;
                }
                let midX = sumX / fighters.length;
                let midY = sumY / fighters.length;

                let maxSpread = 0;
                for (let i = 0; i < fighters.length; i++) {
                    for (let j = i + 1; j < fighters.length; j++) {
                        let d = Math.hypot(fighters[i].x - fighters[j].x, fighters[i].y - fighters[j].y);
                        if (d > maxSpread) maxSpread = d;
                    }
                }

                scale = Math.max(0.25, Math.min(1.0, 900 / (maxSpread + 350)));
                camX = viewportW / 2 - midX * scale;
                camY = viewportH / 2 - midY * scale;
            } else if (cameraMode === 'zoomout') {
                scale = 0.28;
                camX = (viewportW - worldWidth * scale) / 2;
                camY = (viewportH - worldHeight * scale) / 2;
            }

            document.getElementById('world').style.transform = `translate(${camX}px, ${camY}px) scale(${scale})`;
        }

        function updateHUD() {
            let hudText = fighters.map(f => `F${f.id}: ${f.hp}`).join(' | ');
            document.getElementById('hud-stats').innerText = hudText;
        }

        function showWorldText(x, y, text) {
            let el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.getElementById('world').appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function checkWin() {
            let aliveFighters = fighters.filter(f => f.hp > 0);
            if (aliveFighters.length <= 1 && fighters.length > 1) {
                gameRunning = false;
                let winner = aliveFighters.length === 1 ? aliveFighters[0] : fighters[0];

                document.getElementById('winner-text').innerText = `Fighter ${winner.id} Wins!`;
                document.getElementById('winner-img').src = winner.el.src;
                document.getElementById('winner-banner').style.display = 'block';

                setTimeout(() => location.reload(), 5000);
            }
        }
    </script>
</body>
</html>
