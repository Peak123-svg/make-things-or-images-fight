<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Npcs Fight!</title>
    <style>
        body {
            background-color: #111111;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #setup-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #222222;
            padding: 30px;
            border-radius: 4px;
            text-align: center;
            width: 400px;
        }

        .fighter-inputs {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        button {
            padding: 10px 20px;
            background-color: #444444;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background-color: #555555;
        }

        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        #hud {
            display: flex;
            justify-content: space-between;
            width: 900px;
            font-size: 18px;
            font-weight: bold;
        }

        #camera-controls {
            display: flex;
            gap: 5px;
        }

        #camera-controls button {
            padding: 4px 8px;
            font-size: 12px;
            background: #333333;
        }

        #viewport {
            width: 900px;
            height: 520px;
            border: 2px solid #555555;
            position: relative;
            background: #1a1a1a;
            overflow: hidden;
            border-radius: 4px;
        }

        #world {
            position: absolute;
            width: 3000px;
            height: 1800px;
            background: #1e1e1e;
            transform-origin: 0 0;
        }

        .platform {
            position: absolute;
            background: #333333;
            border-radius: 4px;
        }

        .fighter {
            position: absolute;
            width: 140px;
            height: 140px;
            object-fit: contain;
            background: #2a2a2a;
            border: 2px solid #ffffff;
            box-sizing: border-box;
            border-radius: 4px;
        }

        .projectile {
            position: absolute;
            width: 24px;
            height: 24px;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
        }

        .lightning {
            position: absolute;
            height: 6px;
            background: #ffcc00;
            pointer-events: none;
            z-index: 15;
        }

        .floating-text {
            position: absolute;
            font-weight: bold;
            font-size: 20px;
            color: #ff4444;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
            z-index: 20;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-40px); opacity: 0; }
        }

        #winner-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            font-weight: bold;
            color: #ffffff;
            display: none;
            z-index: 30;
            text-align: center;
            background: #222222;
            padding: 30px;
            border: 2px solid #555555;
            border-radius: 4px;
        }

        #winner-banner img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border: 2px solid #ffffff;
            border-radius: 4px;
            margin-top: 15px;
            background: #111;
        }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h2>Npc Maker</h2>
        <div class="fighter-inputs">
            <div class="input-group">
                <label>Fighter 1 Image</label>
                <input type="file" id="img1-input" accept="image/*">
            </div>
            <div class="input-group">
                <label>Fighter 2 Image</label>
                <input type="file" id="img2-input" accept="image/*">
            </div>
        </div>
        <button onclick="startBattle()">Start Fight</button>
    </div>

    <div id="game-screen">
        <div id="hud">
            <div id="hp1">Fighter 1 HP: 1000</div>
            <div id="camera-controls">
                <button onclick="setCameraMode('dynamic')">Cam: Dynamic</button>
                <button onclick="setCameraMode('f1')">Track F1</button>
                <button onclick="setCameraMode('f2')">Track F2</button>
                <button onclick="setCameraMode('zoomout')">Zoom Out</button>
            </div>
            <div id="hp2">Fighter 2 HP: 1000</div>
        </div>
        <div id="viewport">
            <div id="world">
                <div id="platforms-container"></div>
                <div id="winner-banner">
                    <div id="winner-text"></div>
                    <img id="winner-img" src="" alt="Winner">
                </div>
                <img id="fighter1" class="fighter" src="">
                <img id="fighter2" class="fighter" src="">
            </div>
        </div>
    </div>

    <audio id="bgm" loop>
        <source src="https://raw.githubusercontent.com/Peak123-svg/make-things-or-images-fight/main/Roblox%20Music%20-%20Gothic%20-%20Zero%20Project%204.mp3" type="audio/mpeg">
    </audio>

    <script>
        const worldWidth = 3000;
        const worldHeight = 1800;
        const size = 140;

        let f1 = { x: 900, y: 800, vx: 0, vy: 0, hp: 1000, cooldown: 0, el: document.getElementById('fighter1') };
        let f2 = { x: 2000, y: 800, vx: 0, vy: 0, hp: 1000, cooldown: 0, el: document.getElementById('fighter2') };
        
        let projectiles = [];
        let gameRunning = false;
        let cameraMode = 'dynamic';
        let currentPlatforms = [];

        // Map Layout Pool
        const mapPool = [
            // Map 1: Classic Wide Platform
            [ { x: 750, y: 950, w: 1500, h: 60 } ],
            // Map 2: Three Tier Platforms
            [
                { x: 600, y: 1000, w: 600, h: 50 },
                { x: 1800, y: 1000, w: 600, h: 50 },
                { x: 1100, y: 800, w: 800, h: 50 }
            ],
            // Map 3: Floating Pillars
            [
                { x: 500, y: 1100, w: 400, h: 50 },
                { x: 1300, y: 950, w: 400, h: 50 },
                { x: 2100, y: 1100, w: 400, h: 50 }
            ],
            // Map 4: Massive Central Fortress
            [
                { x: 1000, y: 900, w: 1000, h: 80 },
                { x: 700, y: 700, w: 300, h: 40 },
                { x: 2000, y: 700, w: 300, h: 40 }
            ]
        ];

        const massiveAttackPool = [
            { name: "Heavy Punch", damage: 90, type: "melee", kb: 35 },
            { name: "Fireball", damage: 110, type: "projectile", kb: 28 },
            { name: "Thunder Strike", damage: 140, type: "lightning", kb: 32 },
            { name: "Meteor Slam", damage: 160, type: "melee", kb: 50 },
            { name: "Energy Blade", damage: 95, type: "projectile", kb: 25 },
            { name: "Hyper Beam", damage: 150, type: "projectile", kb: 40 },
            { name: "Mega Quake", damage: 180, type: "lightning", kb: 45 },
            { name: "Shadow Kick", damage: 100, type: "melee", kb: 38 },
            { name: "Sonic Blast", damage: 120, type: "projectile", kb: 30 },
            { name: "God Smash", damage: 200, type: "lightning", kb: 55 },
            { name: "Plasma Ray", damage: 130, type: "projectile", kb: 33 },
            { name: "Earth Shatter", damage: 170, type: "melee", kb: 48 }
        ];

        function setCameraMode(mode) {
            cameraMode = mode;
        }

        function loadRandomMap() {
            const container = document.getElementById('platforms-container');
            container.innerHTML = '';
            
            // Pick random map
            let randomMap = mapPool[Math.floor(Math.random() * mapPool.length)];
            currentPlatforms = randomMap;

            randomMap.forEach(p => {
                let pDiv = document.createElement('div');
                pDiv.className = 'platform';
                pDiv.style.left = p.x + 'px';
                pDiv.style.top = p.y + 'px';
                pDiv.style.width = p.w + 'px';
                pDiv.style.height = p.h + 'px';
                container.appendChild(pDiv);
            });
        }

        function startBattle() {
            const file1 = document.getElementById('img1-input').files[0];
            const file2 = document.getElementById('img2-input').files[0];

            if (!file1 || !file2) {
                alert("Please upload both images!");
                return;
            }

            f1.el.src = URL.createObjectURL(file1);
            f2.el.src = URL.createObjectURL(file2);

            loadRandomMap();

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';

            const music = document.getElementById('bgm');
            music.play().catch(e => console.log("Audio autoplay blocked:", e));

            gameRunning = true;
            requestAnimationFrame(updateGame);
        }

        function updateBotAI(fighter, opponent) {
            if (fighter.cooldown > 0) fighter.cooldown--;

            let targetX = opponent.x;
            let dx = targetX - fighter.x;
            
            if (Math.abs(dx) > 30) {
                fighter.vx += Math.sign(dx) * 0.7;
            }
            fighter.vx *= 0.85;

            fighter.vx = Math.max(-10, Math.min(10, fighter.vx));
            fighter.x += fighter.vx;

            fighter.vy += 0.8; // Gravity
            fighter.y += fighter.vy;

            // Check collision with any platform in the current map layout
            let landedOnPlatform = false;
            for (let p of currentPlatforms) {
                if (
                    fighter.x + size > p.x &&
                    fighter.x < p.x + p.w &&
                    fighter.y + size >= p.y &&
                    fighter.y + size <= p.y + 20 &&
                    fighter.vy >= 0
                ) {
                    fighter.y = p.y - size;
                    fighter.vy = 0;
                    landedOnPlatform = true;
                    break;
                }
            }

            // Only allow jumping if they are securely standing on a platform (fixes air-jump spam)
            if (landedOnPlatform && Math.random() < 0.006) {
                fighter.vy = -15;
            }

            // Fall damage / respawn off map
            if (fighter.y > 1650) {
                fighter.hp -= 30;
                if (fighter.hp < 0) fighter.hp = 0;
                showWorldText(fighter.x, fighter.y, "Fall! (-30)");
                updateHUD();
                checkWin();

                fighter.y = 600;
                fighter.vy = -10;
                fighter.x = 1200 + (Math.random() * 600 - 300);
            }

            if (fighter.x < 50) { fighter.x = 50; fighter.vx *= -1; }
            if (fighter.x > worldWidth - size - 50) { fighter.x = worldWidth - size - 50; fighter.vx *= -1; }
        }

        function updateGame() {
            if (!gameRunning) return;

            updateBotAI(f1, f2);
            updateBotAI(f2, f1);

            let dx = (f1.x + size/2) - (f2.x + size/2);
            let dy = (f1.y + size/2) - (f2.y + size/2);
            let distance = Math.hypot(dx, dy);

            if (distance < size) {
                let angle = Math.atan2(dy, dx);
                f1.vx = Math.cos(angle) * 30;
                f1.vy = -16;
                f2.vx = -Math.cos(angle) * 30;
                f2.vy = -16;

                if (f1.cooldown === 0 && f2.cooldown === 0) {
                    let attacker = Math.random() > 0.5 ? 1 : 2;
                    triggerRandomAttack(attacker);
                    f1.cooldown = 70;
                    f2.cooldown = 70;
                }
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.el.style.left = p.x + 'px';
                p.el.style.top = p.y + 'px';

                let target = p.owner === 1 ? f2 : f1;
                let tDist = Math.hypot(p.x - (target.x + size/2), p.y - (target.y + size/2));

                if (tDist < size/2) {
                    target.hp -= p.damage;
                    target.vy -= p.kb * 0.6;
                    target.vx += (p.vx > 0 ? 25 : -25);
                    if (target.hp < 0) target.hp = 0;
                    showWorldText(target.x, target.y, `Hit! (-${p.damage})`);
                    updateHUD();
                    p.el.remove();
                    projectiles.splice(i, 1);
                    checkWin();
                } else if (p.x < 0 || p.x > worldWidth || p.y < 0 || p.y > worldHeight) {
                    p.el.remove();
                    projectiles.splice(i, 1);
                }
            }

            f1.el.style.left = f1.x + 'px';
            f1.el.style.top = f1.y + 'px';
            f2.el.style.left = f2.x + 'px';
            f2.el.style.top = f2.y + 'px';

            updateCamera();

            requestAnimationFrame(updateGame);
        }

        function triggerRandomAttack(attackerNum) {
            if (!gameRunning) return;
            let atk = massiveAttackPool[Math.floor(Math.random() * massiveAttackPool.length)];
            let attacker = attackerNum === 1 ? f1 : f2;
            let target = attackerNum === 1 ? f2 : f1;

            if (atk.type === "projectile") {
                let angle = Math.atan2((target.y + size/2) - (attacker.y + size/2), (target.x + size/2) - (attacker.x + size/2));
                let pEl = document.createElement('div');
                pEl.className = 'projectile';
                document.getElementById('world').appendChild(pEl);

                projectiles.push({
                    x: attacker.x + size/2,
                    y: attacker.y + size/2,
                    vx: Math.cos(angle) * 22,
                    vy: Math.sin(angle) * 22,
                    damage: atk.damage,
                    kb: atk.kb,
                    owner: attackerNum,
                    el: pEl
                });
                showWorldText(attacker.x, attacker.y, atk.name);
            } else if (atk.type === "lightning") {
                target.hp -= atk.damage;
                target.vy -= atk.kb * 0.7;
                target.vx += (attacker.x < target.x ? 25 : -25);
                if (target.hp < 0) target.hp = 0;

                let lEl = document.createElement('div');
                lEl.className = 'lightning';
                let startX = attacker.x + size/2;
                let startY = attacker.y + size/2;
                let endX = target.x + size/2;
                let endY = target.y + size/2;
                let dist = Math.hypot(endX - startX, endY - startY);
                let angle = Math.atan2(endY - startY, endX - startX) * 180 / Math.PI;

                lEl.style.width = dist + 'px';
                lEl.style.left = startX + 'px';
                lEl.style.top = startY + 'px';
                lEl.style.transformOrigin = '0 0';
                lEl.style.transform = `rotate(${angle}deg)`;

                document.getElementById('world').appendChild(lEl);
                setTimeout(() => lEl.remove(), 250);

                showWorldText(target.x, target.y, `${atk.name} (-${atk.damage})`);
                updateHUD();
                checkWin();
            } else {
                target.hp -= atk.damage;
                target.vy -= atk.kb * 0.7;
                target.vx += (attacker.x < target.x ? 30 : -30);
                if (target.hp < 0) target.hp = 0;
                showWorldText(target.x, target.y, `${atk.name} (-${atk.damage})`);
                updateHUD();
                checkWin();
            }
        }

        function updateCamera() {
            let viewportW = 900;
            let viewportH = 520;
            let camX = 0, camY = 0, scale = 1.0;

            if (cameraMode === 'dynamic') {
                let midX = (f1.x + f2.x) / 2 + size/2;
                let midY = (f1.y + f2.y) / 2 + size/2;
                let fighterDist = Math.hypot(f1.x - f2.x, f1.y - f2.y);
                scale = Math.max(0.35, Math.min(1.0, 900 / (fighterDist + 350)));
                camX = viewportW / 2 - midX * scale;
                camY = viewportH / 2 - midY * scale;
            } else if (cameraMode === 'f1') {
                scale = 0.75;
                camX = viewportW / 2 - (f1.x + size/2) * scale;
                camY = viewportH / 2 - (f1.y + size/2) * scale;
            } else if (cameraMode === 'f2') {
                scale = 0.75;
                camX = viewportW / 2 - (f2.x + size/2) * scale;
                camY = viewportH / 2 - (f2.y + size/2) * scale;
            } else if (cameraMode === 'zoomout') {
                scale = 0.28;
                camX = (viewportW - worldWidth * scale) / 2;
                camY = (viewportH - worldHeight * scale) / 2;
            }

            document.getElementById('world').style.transform = `translate(${camX}px, ${camY}px) scale(${scale})`;
        }

        function updateHUD() {
            document.getElementById('hp1').innerText = `Fighter 1 HP: ${f1.hp}`;
            document.getElementById('hp2').innerText = `Fighter 2 HP: ${f2.hp}`;
        }

        function showWorldText(x, y, text) {
            let el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.getElementById('world').appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function checkWin() {
            if (f1.hp <= 0 || f2.hp <= 0) {
                gameRunning = false;
                let winnerName = f1.hp <= 0 ? "Fighter 2" : "Fighter 1";
                let winnerImageSrc = f1.hp <= 0 ? f2.el.src : f1.el.src;

                document.getElementById('winner-text').innerText = `${winnerName} Wins!`;
                document.getElementById('winner-img').src = winnerImageSrc;
                document.getElementById('winner-banner').style.display = 'block';

                setTimeout(() => location.reload(), 5000);
            }
        }
    </script>
</body>
</html>
