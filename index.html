<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Brawler Arena</title>
    <style>
        body {
            background-color: #0f071a;
            color: #f3e8ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #setup-screen {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #1e1035;
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #9333ea;
            box-shadow: 0 0 25px rgba(147, 51, 234, 0.4);
            text-align: center;
        }

        .fighter-inputs {
            display: flex;
            gap: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-weight: bold;
            color: #d8b4fe;
        }

        input[type="file"] {
            color: #f3e8ff;
        }

        button {
            padding: 12px 24px;
            background-color: #9333ea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: background 0.2s;
            box-shadow: 0 0 10px rgba(147, 51, 234, 0.6);
        }

        button:hover {
            background-color: #a855f7;
        }

        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #hud {
            display: flex;
            justify-content: space-between;
            width: 800px;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        #arena {
            width: 800px;
            height: 500px;
            border: 4px solid #a855f7;
            position: relative;
            background: #130926;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(147, 51, 234, 0.3);
            border-radius: 10px;
        }

        .fighter {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #d8b4fe;
            box-shadow: 0 0 15px rgba(216, 180, 254, 0.5);
        }

        .projectile {
            position: absolute;
            width: 24px;
            height: 24px;
            background: radial-gradient(circle, #f3e8ff 0%, #9333ea 70%);
            border-radius: 50%;
            box-shadow: 0 0 12px #c084fc;
            pointer-events: none;
        }

        .floating-text {
            position: absolute;
            font-weight: bold;
            font-size: 20px;
            color: #f0abfc;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            text-shadow: 0 0 8px #7e22ce;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.1); opacity: 0; }
        }

        #winner-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 55px;
            font-weight: bold;
            color: #4ade80;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.8);
            display: none;
            z-index: 20;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Setup Screen -->
    <div id="setup-screen">
        <h2 style="color: #e9d5ff; margin: 0;">Purple Brawler Arena</h2>
        <div class="fighter-inputs">
            <div class="input-group">
                <label>Fighter 1 Image</label>
                <input type="file" id="img1-input" accept="image/*">
            </div>
            <div class="input-group">
                <label>Fighter 2 Image</label>
                <input type="file" id="img2-input" accept="image/*">
            </div>
        </div>
        <button onclick="startBattle()">Start Epic Fight!</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen">
        <div id="hud">
            <div id="hp1" style="color: #c084fc;">Fighter 1 HP: 1000</div>
            <div id="hp2" style="color: #f472b6;">Fighter 2 HP: 1000</div>
        </div>
        <div id="arena">
            <div id="winner-banner"></div>
            <img id="fighter1" class="fighter" src="">
            <img id="fighter2" class="fighter" src="">
        </div>
    </div>

    <!-- Background Music -->
    <audio id="bgm" loop>
        <source src="https://raw.githubusercontent.com/Peak123-svg/make-things-or-images-fight/main/Roblox%20Music%20-%20Gothic%20-%20Zero%20Project%204.mp3" type="audio/mpeg">
    </audio>

    <script>
        let f1 = { x: 50, y: 50, vx: 3.5, vy: 3, hp: 1000, el: document.getElementById('fighter1') };
        let f2 = { x: 650, y: 350, vx: -3.5, vy: -3, hp: 1000, el: document.getElementById('fighter2') };
        let projectiles = [];
        const arenaWidth = 800;
        const arenaHeight = 500;
        const size = 80;
        let gameRunning = false;

        const attackList = [
            { name: "Heavy Punch! 👊", damage: 40, type: "melee" },
            { name: "Shadow Kick! ⚡", damage: 50, type: "melee" },
            { name: "Energy Blast! 💥", damage: 65, type: "projectile" },
            { name: "Gothic Slash! 🗡️", damage: 55, type: "melee" },
            { name: "Laser Beam! 🔮", damage: 75, type: "projectile" },
            { name: "Soul Crunch! 💀", damage: 60, type: "melee" }
        ];

        function startBattle() {
            const file1 = document.getElementById('img1-input').files[0];
            const file2 = document.getElementById('img2-input').files[0];

            if (!file1 || !file2) {
                alert("Please upload both images!");
                return;
            }

            f1.el.src = URL.createObjectURL(file1);
            f2.el.src = URL.createObjectURL(file2);

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';

            const music = document.getElementById('bgm');
            music.play().catch(e => console.log("Audio autoplay blocked:", e));

            gameRunning = true;
            requestAnimationFrame(updateGame);
        }

        function updateGame() {
            if (!gameRunning) return;

            // Move fighters
            f1.x += f1.vx;
            f1.y += f1.vy;
            f2.x += f2.vx;
            f2.y += f2.vy;

            // Wall bounces (DVD style) + random minor wall collision chatter
            if (f1.x <= 0 || f1.x >= arenaWidth - size) { f1.vx *= -1; }
            if (f1.y <= 0 || f1.y >= arenaHeight - size) { f1.vy *= -1; }
            if (f2.x <= 0 || f2.x >= arenaWidth - size) { f2.vx *= -1; }
            if (f2.y <= 0 || f2.y >= arenaHeight - size) { f2.vy *= -1; }

            // Collision check between fighters (They attack each other on impact!)
            let dx = (f1.x + size/2) - (f2.x + size/2);
            let dy = (f1.y + size/2) - (f2.y + size/2);
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < size) {
                // Elastic bounce swap
                let tempVx = f1.vx; let tempVy = f1.vy;
                f1.vx = f2.vx; f1.vy = f2.vy;
                f2.vx = tempVx; f2.vy = tempVy;

                // Push them apart slightly so they don't get stuck
                f1.x += f1.vx * 2;
                f1.y += f1.vy * 2;

                // Random attacker triggers an attack
                let activeAttacker = Math.random() > 0.5 ? 1 : 2;
                triggerAttack(activeAttacker);
            }

            // Update Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.el.style.left = p.x + 'px';
                p.el.style.top = p.y + 'px';

                // Check collision with target
                let target = p.owner === 1 ? f2 : f1;
                let tCenterX = target.x + size/2;
                let tCenterY = target.y + size/2;
                let pDist = Math.hypot(p.x - tCenterX, p.y - tCenterY);

                if (pDist < size/2) {
                    target.hp -= p.damage;
                    if (target.hp < 0) target.hp = 0;
                    showFloatingText(target.x, target.y, `Hit by Projectile! (-${p.damage})`);
                    updateHUD();
                    p.el.remove();
                    projectiles.splice(i, 1);
                    checkWinCondition();
                } else if (p.x < 0 || p.x > arenaWidth || p.y < 0 || p.y > arenaHeight) {
                    // Out of bounds
                    p.el.remove();
                    projectiles.splice(i, 1);
                }
            }

            // Update DOM positions
            f1.el.style.left = f1.x + 'px';
            f1.el.style.top = f1.y + 'px';
            f2.el.style.left = f2.x + 'px';
            f2.el.style.top = f2.y + 'px';

            requestAnimationFrame(updateGame);
        }

        function triggerAttack(attackerNum) {
            if (!gameRunning) return;

            let attack = attackList[Math.floor(Math.random() * attackList.length)];
            let target = attackerNum === 1 ? f2 : f1;
            let attackerObj = attackerNum === 1 ? f1 : f2;

            if (attack.type === "projectile") {
                // Spawn a real projectile moving toward the opponent
                let targetObj = attackerNum === 1 ? f2 : f1;
                let startX = attackerObj.x + size/2;
                let startY = attackerObj.y + size/2;
                let targetX = targetObj.x + size/2;
                let targetY = targetObj.y + size/2;

                let angle = Math.atan2(targetY - startY, targetX - startX);
                let speed = 6;

                let projEl = document.createElement('div');
                projEl.className = 'projectile';
                document.getElementById('arena').appendChild(projEl);

                projectiles.push({
                    x: startX,
                    y: startY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    damage: attack.damage,
                    owner: attackerNum,
                    el: projEl
                });

                showFloatingText(attackerObj.x, attackerObj.y, `${attack.name}`);
            } else {
                // Melee direct damage
                target.hp -= attack.damage;
                if (target.hp < 0) target.hp = 0;
                showFloatingText(target.x, target.y, `${attack.name} (-${attack.damage})`);
                updateHUD();
                checkWinCondition();
            }
        }

        function updateHUD() {
            document.getElementById('hp1').innerText = `Fighter 1 HP: ${f1.hp}`;
            document.getElementById('hp2').innerText = `Fighter 2 HP: ${f2.hp}`;
        }

        function checkWinCondition() {
            if (f1.hp <= 0 || f2.hp <= 0) {
                gameRunning = false;
                let winnerName = f1.hp <= 0 ? "Opponent 2" : "Opponent 1";
                let banner = document.getElementById('winner-banner');
                banner.innerText = `${winnerName} Wins!`;
                banner.style.display = 'block';

                setTimeout(() => {
                    location.reload();
                }, 4000);
            }
        }

        function showFloatingText(x, y, text) {
            let floatEl = document.createElement('div');
            floatEl.className = 'floating-text';
            floatEl.innerText = text;
            floatEl.style.left = x + 'px';
            floatEl.style.top = y + 'px';
            document.getElementById('arena').appendChild(floatEl);

            setTimeout(() => {
                floatEl.remove();
            }, 800);
        }
    </script>
</body>
</html>
