<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Brawler Arena</title>
    <style>
        body {
            background-color: #0c0514;
            color: #f3e8ff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #setup-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #170b28;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #8b5cf6;
            text-align: center;
        }

        .fighter-inputs {
            display: flex;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: #8b5cf6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background-color: #7c3aed;
        }

        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        #hud {
            display: flex;
            justify-content: space-between;
            width: 700px;
            font-size: 18px;
            font-weight: bold;
        }

        /* Viewport acts as the camera screen looking into the large world */
        #viewport {
            width: 700px;
            height: 450px;
            border: 4px solid #a78bfa;
            position: relative;
            background: #07020d;
            overflow: hidden;
            border-radius: 8px;
        }

        /* Large world containing the fighters */
        #world {
            position: absolute;
            width: 1400px;
            height: 900px;
            border: 2px dashed rgba(167, 139, 250, 0.2);
            transform-origin: 0 0;
        }

        .fighter {
            position: absolute;
            width: 90px;
            height: 90px;
            object-fit: contain;
            background: #1e1b4b;
            border: 3px solid #ffffff;
            box-sizing: border-box;
        }

        .projectile {
            position: absolute;
            width: 18px;
            height: 18px;
            background: #c084fc;
            border-radius: 50%;
            box-shadow: 0 0 10px #e879f9;
            pointer-events: none;
        }

        .floating-text {
            position: absolute;
            font-weight: bold;
            font-size: 16px;
            color: #f472b6;
            animation: floatUp 0.7s ease-out forwards;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
            z-index: 10;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-35px); opacity: 0; }
        }

        #winner-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 45px;
            font-weight: bold;
            color: #4ade80;
            text-shadow: 2px 2px 8px #000;
            display: none;
            z-index: 20;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Setup Screen -->
    <div id="setup-screen">
        <h2>Select your fighters</h2>
        <div class="fighter-inputs">
            <div class="input-group">
                <label>Fighter 1</label>
                <input type="file" id="img1-input" accept="image/*">
            </div>
            <div class="input-group">
                <label>Fighter 2</label>
                <input type="file" id="img2-input" accept="image/*">
            </div>
        </div>
        <button onclick="startBattle()">Start Fight!</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen">
        <div id="hud">
            <div id="hp1" style="color: #a78bfa;">Fighter 1 HP: 1000</div>
            <div id="hp2" style="color: #f472b6;">Fighter 2 HP: 1000</div>
        </div>
        <div id="viewport">
            <div id="world">
                <div id="winner-banner"></div>
                <img id="fighter1" class="fighter" src="">
                <img id="fighter2" class="fighter" src="">
            </div>
        </div>
    </div>

    <!-- Background Music -->
    <audio id="bgm" loop>
        <source src="https://raw.githubusercontent.com/Peak123-svg/make-things-or-images-fight/main/Roblox%20Music%20-%20Gothic%20-%20Zero%20Project%204.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Large World Dimensions
        const worldWidth = 1400;
        const worldHeight = 900;
        const size = 90;

        let f1 = { x: 200, y: 200, vx: 6, vy: 5, hp: 1000, el: document.getElementById('fighter1') };
        let f2 = { x: 1100, y: 700, vx: -6, vy: -5, hp: 1000, el: document.getElementById('fighter2') };
        let projectiles = [];
        let gameRunning = false;

        const attacks = [
            { name: "Punch! 👊", damage: 40, type: "melee" },
            { name: "Laser! ⚡", damage: 60, type: "projectile" },
            { name: "Kick! 💥", damage: 50, type: "melee" },
            { name: "Slash! 🗡️", damage: 55, type: "projectile" }
        ];

        function startBattle() {
            const file1 = document.getElementById('img1-input').files[0];
            const file2 = document.getElementById('img2-input').files[0];

            if (!file1 || !file2) {
                alert("Please upload both images!");
                return;
            }

            f1.el.src = URL.createObjectURL(file1);
            f2.el.src = URL.createObjectURL(file2);

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';

            const music = document.getElementById('bgm');
            music.play().catch(e => console.log("Audio autoplay blocked:", e));

            gameRunning = true;
            requestAnimationFrame(updateGame);
        }

        function updateGame() {
            if (!gameRunning) return;

            // Fast Movement
            f1.x += f1.vx;
            f1.y += f1.vy;
            f2.x += f2.vx;
            f2.y += f2.vy;

            // World Wall Bounces
            if (f1.x <= 0 || f1.x >= worldWidth - size) f1.vx *= -1;
            if (f1.y <= 0 || f1.y >= worldHeight - size) f1.vy *= -1;
            if (f2.x <= 0 || f2.x >= worldWidth - size) f2.vx *= -1;
            if (f2.y <= 0 || f2.y >= worldHeight - size) f2.vy *= -1;

            // Aggressive Collision Detection (Always forces a crash/fight)
            let dx = (f1.x + size/2) - (f2.x + size/2);
            let dy = (f1.y + size/2) - (f2.y + size/2);
            let distance = Math.hypot(dx, dy);

            if (distance < size + 15) {
                // Bounce and swap vector momentum
                let tempVx = f1.vx; let tempVy = f1.vy;
                f1.vx = f2.vx; f1.vy = f2.vy;
                f2.vx = tempVx; f2.vy = tempVy;

                // Nudge them apart to prevent clipping
                f1.x += f1.vx; f1.y += f1.vy;
                f2.x += f2.vx; f2.y += f2.vy;

                // Trigger a combat strike on crash
                let attacker = Math.random() > 0.5 ? 1 : 2;
                triggerAttack(attacker);
            }

            // Update Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.el.style.left = p.x + 'px';
                p.el.style.top = p.y + 'px';

                let target = p.owner === 1 ? f2 : f1;
                let tDist = Math.hypot(p.x - (target.x + size/2), p.y - (target.y + size/2));

                if (tDist < size/2) {
                    target.hp -= p.damage;
                    if (target.hp < 0) target.hp = 0;
                    showWorldText(target.x, target.y, `Hit! (-${p.damage})`);
                    updateHUD();
                    p.el.remove();
                    projectiles.splice(i, 1);
                    checkWin();
                } else if (p.x < 0 || p.x > worldWidth || p.y < 0 || p.y > worldHeight) {
                    p.el.remove();
                    projectiles.splice(i, 1);
                }
            }

            // Render Fighter Positions
            f1.el.style.left = f1.x + 'px';
            f1.el.style.top = f1.y + 'px';
            f2.el.style.left = f2.x + 'px';
            f2.el.style.top = f2.y + 'px';

            // Dynamic Camera Tracking (Centers between both fighters & handles zoom)
            updateCamera();

            requestAnimationFrame(updateGame);
        }

        function triggerAttack(attackerNum) {
            if (!gameRunning) return;
            let atk = attacks[Math.floor(Math.random() * attacks.length)];
            let attacker = attackerNum === 1 ? f1 : f2;
            let target = attackerNum === 1 ? f2 : f1;

            if (atk.type === "projectile") {
                let angle = Math.atan2((target.y + size/2) - (attacker.y + size/2), (target.x + size/2) - (attacker.x + size/2));
                let pEl = document.createElement('div');
                pEl.className = 'projectile';
                document.getElementById('world').appendChild(pEl);

                projectiles.push({
                    x: attacker.x + size/2,
                    y: attacker.y + size/2,
                    vx: Math.cos(angle) * 9,
                    vy: Math.sin(angle) * 9,
                    damage: atk.damage,
                    owner: attackerNum,
                    el: pEl
                });
                showWorldText(attacker.x, attacker.y, atk.name);
            } else {
                target.hp -= atk.damage;
                if (target.hp < 0) target.hp = 0;
                showWorldText(target.y ? target.x : 0, target.y, `${atk.name} (-${atk.damage})`);
                updateHUD();
                checkWin();
            }
        }

        function updateCamera() {
            let viewportW = 700;
            let viewportH = 450;

            // Find midpoint between fighters
            let midX = (f1.x + f2.x) / 2 + size/2;
            let midY = (f1.y + f2.y) / 2 + size/2;

            // Distance between fighters to dynamically zoom out if they are far apart
            let fighterDist = Math.hypot(f1.x - f2.x, f1.y - f2.y);
            let scale = Math.max(0.55, Math.min(1.0, 700 / (fighterDist + 250)));

            // Center camera on midpoint
            let camX = viewportW / 2 - midX * scale;
            let camY = viewportH / 2 - midY * scale;

            document.getElementById('world').style.transform = `translate(${camX}px, ${camY}px) scale(${scale})`;
        }

        function updateHUD() {
            document.getElementById('hp1').innerText = `Fighter 1 HP: ${f1.hp}`;
            document.getElementById('hp2').innerText = `Fighter 2 HP: ${f2.hp}`;
        }

        function showWorldText(x, y, text) {
            let el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.getElementById('world').appendChild(el);
            setTimeout(() => el.remove(), 700);
        }

        function checkWin() {
            if (f1.hp <= 0 || f2.hp <= 0) {
                gameRunning = false;
                let winner = f1.hp <= 0 ? "Opponent 2" : "Opponent 1";
                let banner = document.getElementById('winner-banner');
                banner.innerText = `${winner} Wins!`;
                banner.style.display = 'block';
                setTimeout(() => location.reload(), 4000);
            }
        }
    </script>
</body>
</html>
