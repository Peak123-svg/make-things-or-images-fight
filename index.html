<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Brawler Arena</title>
    <style>
        body {
            background-color: #0c0514;
            color: #f3e8ff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #setup-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #170b28;
            padding: 25px;
            border-radius: 10px;
            border: 2px solid #8b5cf6;
            text-align: center;
            width: 550px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .fighter-inputs {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        #attacks-config {
            max-height: 180px;
            overflow-y: auto;
            text-align: left;
            background: #10061c;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #4c1d95;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .attack-row {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        button {
            padding: 10px 20px;
            background-color: #7c3aed;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        button:hover {
            background-color: #6d28d9;
        }

        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        #hud {
            display: flex;
            justify-content: space-between;
            width: 900px;
            font-size: 18px;
            font-weight: bold;
        }

        #camera-controls {
            display: flex;
            gap: 8px;
        }

        #camera-controls button {
            padding: 5px 10px;
            font-size: 12px;
            background: #4c1d95;
        }

        #viewport {
            width: 900px;
            height: 520px;
            border: 4px solid #7c3aed;
            position: relative;
            background: #07020d;
            overflow: hidden;
            border-radius: 6px;
        }

        #world {
            position: absolute;
            width: 3000px;
            height: 1800px;
            border: 2px dashed #4c1d95;
            transform-origin: 0 0;
        }

        .fighter {
            position: absolute;
            width: 160px;
            height: 160px;
            object-fit: contain;
            background: #1e1b4b;
            border: 4px solid #ffffff;
            box-sizing: border-box;
        }

        .projectile {
            position: absolute;
            width: 24px;
            height: 24px;
            background: #d8b4fe;
            border: 2px solid #ffffff;
            pointer-events: none;
        }

        .lightning {
            position: absolute;
            height: 6px;
            background: #ffffff;
            pointer-events: none;
            z-index: 15;
            box-shadow: 0 0 8px #c084fc;
        }

        .floating-text {
            position: absolute;
            font-weight: bold;
            font-size: 20px;
            color: #f472b6;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
            z-index: 20;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-45px); opacity: 0; }
        }

        #winner-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 50px;
            font-weight: bold;
            color: #4ade80;
            text-shadow: 2px 2px 8px #000;
            display: none;
            z-index: 30;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Setup Screen -->
    <div id="setup-screen">
        <h2>Custom Brawler Arena Builder</h2>
        <div class="fighter-inputs">
            <div class="input-group">
                <label>Fighter 1 Image</label>
                <input type="file" id="img1-input" accept="image/*">
            </div>
            <div class="input-group">
                <label>Fighter 2 Image</label>
                <input type="file" id="img2-input" accept="image/*">
            </div>
        </div>

        <label style="font-size: 14px; font-weight: bold; text-align: left;">Configure Variety of Attacks:</label>
        <div id="attacks-config">
            <div class="attack-row">
                <input type="text" class="atk-name" value="Heavy Smash" style="width:50%;">
                <input type="number" class="atk-dmg" value="45" style="width:20%;">
                <select class="atk-type" style="width:25%;">
                    <option value="melee">Melee</option>
                    <option value="projectile">Projectile</option>
                    <option value="lightning">Lightning</option>
                </select>
            </div>
            <div class="attack-row">
                <input type="text" class="atk-name" value="Plasma Cannon" style="width:50%;">
                <input type="number" class="atk-dmg" value="65" style="width:20%;">
                <select class="atk-type" style="width:25%;">
                    <option value="melee">Melee</option>
                    <option value="projectile" selected>Projectile</option>
                    <option value="lightning">Lightning</option>
                </select>
            </div>
            <div class="attack-row">
                <input type="text" class="atk-name" value="Thunder Bolt" style="width:50%;">
                <input type="number" class="atk-dmg" value="85" style="width:20%;">
                <select class="atk-type" style="width:25%;">
                    <option value="melee">Melee</option>
                    <option value="projectile">Projectile</option>
                    <option value="lightning" selected>Lightning</option>
                </select>
            </div>
            <div class="attack-row">
                <input type="text" class="atk-name" value="Shadow Rush" style="width:50%;">
                <input type="number" class="atk-dmg" value="50" style="width:20%;">
                <select class="atk-type" style="width:25%;">
                    <option value="melee" selected>Melee</option>
                    <option value="projectile">Projectile</option>
                    <option value="lightning">Lightning</option>
                </select>
            </div>
            <div class="attack-row">
                <input type="text" class="atk-name" value="Mega Laser" style="width:50%;">
                <input type="number" class="atk-dmg" value="75" style="width:20%;">
                <select class="atk-type" style="width:25%;">
                    <option value="melee">Melee</option>
                    <option value="projectile" selected>Projectile</option>
                    <option value="lightning">Lightning</option>
                </select>
            </div>
        </div>
        <button onclick="addAttackRow()">+ Add Another Attack</button>
        <button onclick="startBattle()">Start Epic Fight!</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen">
        <div id="hud">
            <div id="hp1" style="color: #c084fc;">Fighter 1 HP: 1000</div>
            <div id="camera-controls">
                <button onclick="setCameraMode('dynamic')">Cam: Dynamic</button>
                <button onclick="setCameraMode('f1')">Track F1</button>
                <button onclick="setCameraMode('f2')">Track F2</button>
                <button onclick="setCameraMode('zoomout')">Zoom Out</button>
            </div>
            <div id="hp2" style="color: #f472b6;">Fighter 2 HP: 1000</div>
        </div>
        <div id="viewport">
            <div id="world">
                <div id="winner-banner"></div>
                <img id="fighter1" class="fighter" src="">
                <img id="fighter2" class="fighter" src="">
            </div>
        </div>
    </div>

    <!-- Background Music -->
    <audio id="bgm" loop>
        <source src="https://raw.githubusercontent.com/Peak123-svg/make-things-or-images-fight/main/Roblox%20Music%20-%20Gothic%20-%20Zero%20Project%204.mp3" type="audio/mpeg">
    </audio>

    <script>
        const worldWidth = 3000;
        const worldHeight = 1800;
        const size = 160; // Much bigger fighters

        let f1 = { x: 400, y: 400, vx: 18, vy: 16, hp: 1000, el: document.getElementById('fighter1') };
        let f2 = { x: 2400, y: 1300, vx: -18, vy: -16, hp: 1000, el: document.getElementById('fighter2') };
        let projectiles = [];
        let gameRunning = false;
        let cameraMode = 'dynamic';
        let customAttacks = [];

        function setCameraMode(mode) {
            cameraMode = mode;
        }

        function addAttackRow() {
            let container = document.getElementById('attacks-config');
            let row = document.createElement('div');
            row.className = 'attack-row';
            row.innerHTML = `
                <input type="text" class="atk-name" value="Custom Strike" style="width:50%;">
                <input type="number" class="atk-dmg" value="50" style="width:20%;">
                <select class="atk-type" style="width:25%;">
                    <option value="melee">Melee</option>
                    <option value="projectile">Projectile</option>
                    <option value="lightning">Lightning</option>
                </select>
            `;
            container.appendChild(row);
        }

        function startBattle() {
            const file1 = document.getElementById('img1-input').files[0];
            const file2 = document.getElementById('img2-input').files[0];

            if (!file1 || !file2) {
                alert("Please upload both images!");
                return;
            }

            // Collect all user configured attacks
            customAttacks = [];
            let rows = document.querySelectorAll('.attack-row');
            rows.forEach(r => {
                let name = r.querySelector('.atk-name').value;
                let damage = Number(r.querySelector('.atk-dmg').value);
                let type = r.querySelector('.atk-type').value;
                customAttacks.push({ name, damage, type });
            });

            if (customAttacks.length === 0) {
                alert("Please add at least one attack!");
                return;
            }

            f1.el.src = URL.createObjectURL(file1);
            f2.el.src = URL.createObjectURL(file2);

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';

            const music = document.getElementById('bgm');
            music.play().catch(e => console.log("Audio autoplay blocked:", e));

            gameRunning = true;
            requestAnimationFrame(updateGame);
        }

        function updateGame() {
            if (!gameRunning) return;

            // Blazing fast speeds for 160px fighters
            f1.x += f1.vx;
            f1.y += f1.vy;
            f2.x += f2.vx;
            f2.y += f2.vy;

            // Wall bounces
            if (f1.x <= 0 || f1.x >= worldWidth - size) f1.vx *= -1;
            if (f1.y <= 0 || f1.y >= worldHeight - size) f1.vy *= -1;
            if (f2.x <= 0 || f2.x >= worldWidth - size) f2.vx *= -1;
            if (f2.y <= 0 || f2.y >= worldHeight - size) f2.vy *= -1;

            // Collision detection matching larger fighter dimensions
            let dx = (f1.x + size/2) - (f2.x + size/2);
            let dy = (f1.y + size/2) - (f2.y + size/2);
            let distance = Math.hypot(dx, dy);

            if (distance < size) {
                let tempVx = f1.vx; let tempVy = f1.vy;
                f1.vx = f2.vx; f1.vy = f2.vy;
                f2.vx = tempVx; f2.vy = tempVy;

                f1.x += f1.vx; f1.y += f1.vy;
                f2.x += f2.vx; f2.y += f2.vy;

                let attacker = Math.random() > 0.5 ? 1 : 2;
                triggerAttack(attacker);
            }

            // Update Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.el.style.left = p.x + 'px';
                p.el.style.top = p.y + 'px';

                let target = p.owner === 1 ? f2 : f1;
                let tDist = Math.hypot(p.x - (target.x + size/2), p.y - (target.y + size/2));

                if (tDist < size/2) {
                    target.hp -= p.damage;
                    if (target.hp < 0) target.hp = 0;
                    showWorldText(target.x, target.y, `Hit! (-${p.damage})`);
                    updateHUD();
                    p.el.remove();
                    projectiles.splice(i, 1);
                    checkWin();
                } else if (p.x < 0 || p.x > worldWidth || p.y < 0 || p.y > worldHeight) {
                    p.el.remove();
                    projectiles.splice(i, 1);
                }
            }

            // Render Positions
            f1.el.style.left = f1.x + 'px';
            f1.el.style.top = f1.y + 'px';
            f2.el.style.left = f2.x + 'px';
            f2.el.style.top = f2.y + 'px';

            updateCamera();

            requestAnimationFrame(updateGame);
        }

        function triggerAttack(attackerNum) {
            if (!gameRunning) return;
            let atk = customAttacks[Math.floor(Math.random() * customAttacks.length)];
            let attacker = attackerNum === 1 ? f1 : f2;
            let target = attackerNum === 1 ? f2 : f1;

            if (atk.type === "projectile") {
                let angle = Math.atan2((target.y + size/2) - (attacker.y + size/2), (target.x + size/2) - (attacker.x + size/2));
                let pEl = document.createElement('div');
                pEl.className = 'projectile';
                document.getElementById('world').appendChild(pEl);

                projectiles.push({
                    x: attacker.x + size/2,
                    y: attacker.y + size/2,
                    vx: Math.cos(angle) * 22,
                    vy: Math.sin(angle) * 22,
                    damage: atk.damage,
                    owner: attackerNum,
                    el: pEl
                });
                showWorldText(attacker.x, attacker.y, atk.name);
            } else if (atk.type === "lightning") {
                // Instant lightning strike across the screen
                target.hp -= atk.damage;
                if (target.hp < 0) target.hp = 0;

                let lEl = document.createElement('div');
                lEl.className = 'lightning';
                let startX = attacker.x + size/2;
                let startY = attacker.y + size/2;
                let endX = target.x + size/2;
                let endY = target.y + size/2;
                let dist = Math.hypot(endX - startX, endY - startY);
                let angle = Math.atan2(endY - startY, endX - startX) * 180 / Math.PI;

                lEl.style.width = dist + 'px';
                lEl.style.left = startX + 'px';
                lEl.style.top = startY + 'px';
                lEl.style.transformOrigin = '0 0';
                lEl.style.transform = `rotate(${angle}deg)`;

                document.getElementById('world').appendChild(lEl);
                setTimeout(() => lEl.remove(), 250);

                showWorldText(target.x, target.y, `${atk.name} (-${atk.damage})`);
                updateHUD();
                checkWin();
            } else {
                target.hp -= atk.damage;
                if (target.hp < 0) target.hp = 0;
                showWorldText(target.x, target.y, `${atk.name} (-${atk.damage})`);
                updateHUD();
                checkWin();
            }
        }

        function updateCamera() {
            let viewportW = 900;
            let viewportH = 520;
            let camX = 0, camY = 0, scale = 1.0;

            if (cameraMode === 'dynamic') {
                let midX = (f1.x + f2.x) / 2 + size/2;
                let midY = (f1.y + f2.y) / 2 + size/2;
                let fighterDist = Math.hypot(f1.x - f2.x, f1.y - f2.y);
                scale = Math.max(0.3, Math.min(1.0, 900 / (fighterDist + 400)));
                camX = viewportW / 2 - midX * scale;
                camY = viewportH / 2 - midY * scale;
            } else if (cameraMode === 'f1') {
                scale = 0.7;
                camX = viewportW / 2 - (f1.x + size/2) * scale;
                camY = viewportH / 2 - (f1.y + size/2) * scale;
            } else if (cameraMode === 'f2') {
                scale = 0.7;
                camX = viewportW / 2 - (f2.x + size/2) * scale;
                camY = viewportH / 2 - (f2.y + size/2) * scale;
            } else if (cameraMode === 'zoomout') {
                scale = 0.28;
                camX = (viewportW - worldWidth * scale) / 2;
                camY = (viewportH - worldHeight * scale) / 2;
            }

            document.getElementById('world').style.transform = `translate(${camX}px, ${camY}px) scale(${scale})`;
        }

        function updateHUD() {
            document.getElementById('hp1').innerText = `Fighter 1 HP: ${f1.hp}`;
            document.getElementById('hp2').innerText = `Fighter 2 HP: ${f2.hp}`;
        }

        function showWorldText(x, y, text) {
            let el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.getElementById('world').appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function checkWin() {
            if (f1.hp <= 0 || f2.hp <= 0) {
                gameRunning = false;
                let winner = f1.hp <= 0 ? "Opponent 2" : "Opponent 1";
                let banner = document.getElementById('winner-banner');
                banner.innerText = `${winner} Wins!`;
                banner.style.display = 'block';
                setTimeout(() => location.reload(), 4000);
            }
        }
    </script>
</body>
</html>
